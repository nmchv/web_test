<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тесты</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2330;--mut:#6b7280;--ac:#3b6cf6;--ok:#16a34a;--bad:#dc2626;--bd:#e3e6ee}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b202b;--tx:#e8ebf2;--mut:#9aa3b2;--bd:#2c3340}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
main{max-width:680px;margin:0 auto;padding:16px 14px 60px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h1{font-size:22px;margin:14px 0 10px}h2{font-size:17px;margin:0 0 10px}
input:not([type=checkbox]):not([type=radio]),select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px;margin-bottom:8px}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-size:16px;cursor:pointer;width:100%;margin-top:8px}
button.alt{background:var(--bd);color:var(--tx)}a{color:var(--ac)}
label.opt{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;cursor:pointer}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.row input:not([type=checkbox]):not([type=radio]){margin:0}
.ok{border-color:var(--ok)!important}.bad{border-color:var(--bad)!important}.mut{color:var(--mut);font-size:14px}.big{font-size:40px;font-weight:700}
summary{cursor:pointer}.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}
</style>
</head><body><main id="app"></main>
<script>
const API="https://cloud.nmchv.ru/tests-api"; // адрес вашего API
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let login=localStorage.getItem("login")||"";
const api=(p,o)=>fetch(API+p,o).then(r=>{if(!r.ok)throw 0;return r.json()});
const fmt=(it,v)=>it.type==="text"?((Array.isArray(v)?v[0]:v)||"—"):([].concat(v??[]).map(j=>it.options[j]).join(", ")||"—");
const review=r=>r.items.map((it,i)=>`<div class="card ${it.right?"ok":"bad"}"><b>${i+1}. ${esc(it.q)}</b><br>${it.right?"✅":"❌"} Ваш ответ: ${esc(fmt(it,it.given))}${it.right?"":"<br>Правильно: "+esc(fmt(it,it.correct))}</div>`).join("");

function route(){const t=new URLSearchParams(location.search).get("test");!login?loginView():t?startTest(t):home()}
function loginView(){
  app.innerHTML=`<h1>Тесты</h1><div class="card"><h2>Ваш логин</h2><input id="lg" placeholder="например: ivanov" autocomplete="username"><p class="mut">Всегда вводите один и тот же логин — по нему сохраняются ваши результаты.</p><button id="go">Войти</button></div>`;
  document.getElementById("go").onclick=()=>{const v=document.getElementById("lg").value.trim();if(v.length<2)return alert("Введите логин");login=v.toLowerCase();localStorage.setItem("login",login);route()};
}
async function home(){
  app.innerHTML='<p class="mut">Загрузка…</p>';
  try{
    const [tests,hist]=await Promise.all([api("/tests"),api("/history?login="+encodeURIComponent(login))]);
    app.innerHTML=`<div class="row"><b>👤 ${esc(login)}</b><a href="#" id="out">Выйти</a></div><h1>Тесты</h1>`+
      (tests.map(t=>`<div class="card"><h2>${esc(t.title)}</h2><button data-t="${esc(t.id)}">Пройти</button></div>`).join("")||'<p class="mut">Пока нет тестов</p>')+
      '<h1>Мои результаты</h1>'+(hist.slice().reverse().map(r=>`<details class="card"><summary><b>${esc(r.title)}</b> — ${r.score}/${r.total} <span class="mut">${new Date(r.date).toLocaleString("ru")}</span></summary><br>${review(r)}</details>`).join("")||'<p class="mut">Вы ещё не проходили тесты</p>');
    document.getElementById("out").onclick=e=>{e.preventDefault();localStorage.removeItem("login");login="";history.replaceState(0,"",location.pathname);loginView()};
    app.querySelectorAll("button[data-t]").forEach(b=>b.onclick=()=>startTest(b.dataset.t));
  }catch{app.innerHTML='<div class="card">Нет связи с сервером.</div>'}
}
async function startTest(id){
  let t;try{t=await api("/tests/"+encodeURIComponent(id))}catch{app.innerHTML='<div class="card">Тест не найден.</div><button class="alt" onclick="goHome()">Назад</button>';return}
  app.innerHTML=`<h1>${esc(t.title)}</h1><p class="mut">${esc(login)}</p>`+t.questions.map((q,i)=>`<div class="card"><h2>${i+1}. ${esc(q.q)}</h2>`+
    (q.type==="text"?`<input name="q${i}" autocomplete="off">`:q.options.map((o,j)=>`<label class="opt"><input type="${q.type==="multi"?"checkbox":"radio"}" name="q${i}" value="${j}"><span>${esc(o)}</span></label>`).join(""))+"</div>").join("")+'<button id="fin">Завершить</button>';
  let timer;
  if(t.time){let left=t.time*60;const bar=document.createElement("div");bar.style.cssText="position:sticky;top:0;background:var(--ac);color:#fff;text-align:center;padding:8px;border-radius:10px;margin-bottom:12px;font-weight:700;z-index:5";app.prepend(bar);
    const tick=()=>{bar.textContent="⏱ "+Math.floor(left/60)+":"+String(left%60).padStart(2,"0");if(left--<=0){clearInterval(timer);document.getElementById("fin").click()}};tick();timer=setInterval(tick,1000)}
  document.getElementById("fin").onclick=async()=>{
    const answers=t.questions.map((q,i)=>{const els=[...document.getElementsByName("q"+i)];return q.type==="text"?els[0].value:els.filter(e=>e.checked).map(e=>+e.value)});
    try{
      const r=await api("/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({login,testId:id,answers})});clearInterval(timer);
      app.innerHTML=`<div class="card" style="text-align:center"><div class="big">${r.score} / ${r.total}</div><p>${Math.round(r.score/r.total*100)}%</p></div>${review(r)}<button class="alt" onclick="goHome()">К списку тестов</button>`;scrollTo(0,0);
    }catch{alert("Не удалось отправить ответы. Попробуйте ещё раз.")}
  };
}
function goHome(){history.replaceState(0,"",location.pathname);home()}
route();
</script></body></html>
